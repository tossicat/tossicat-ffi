# cbindgen 설정 파일
# 빌드 시 tossicat.h 헤더 파일을 자동으로 생성합니다.

language = "C"
include_guard = "TOSSICAT_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify this manually. */"

header = """
#ifdef _WIN32
#  ifdef TOSSICAT_EXPORTS
#    define TOSSICAT_API __declspec(dllexport)
#  else
#    define TOSSICAT_API __declspec(dllimport)
#  endif
#else
#  define TOSSICAT_API
#endif
"""

[export]
prefix = "tossicat"

[fn]
prefix = "TOSSICAT_API"
