[package]
name = "tossicat-ffi"
version = "0.8.0"
edition = "2021"
description = "C FFI bindings for tossicat - Korean particle (tossi/josa) converter"
license = "MIT"
repository = "https://github.com/tossicat/tossicat-ffi"
keywords = ["korean", "particle", "josa", "ffi", "c"]
categories = ["localization", "text-processing"]

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["source-crates-io"]
source-crates-io = ["dep:tossicat-crates"]
source-github = ["dep:tossicat-git"]

[dependencies]
tossicat-crates = { package = "tossicat", version = "0.8", optional = true }
tossicat-git = { package = "tossicat", git = "https://github.com/tossicat/tossicat-core", branch = "main", optional = true }

[build-dependencies]
cbindgen = "0.27"
